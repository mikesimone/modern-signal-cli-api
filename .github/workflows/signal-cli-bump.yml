name: signal-cli bump
# Weekly: if AsamK/signal-cli has a newer release, point the Dockerfile at it (version + SHA-256), run the whole
# test-suite AND the contract check against that real release, and only if everything passes put it on main.
# If anything fails, open an issue instead, so a signal-cli change never lands silently broken.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Point the Dockerfile at the latest signal-cli
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(contract/bump-signal-cli.sh)"; echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^ARG SIGNAL_CLI_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Tests and contract check against the new release
        if: startsWith(steps.bump.outputs.result, 'bumped')
        id: check
        run: contract/run.sh 2>&1 | tee check.log
        continue-on-error: true
      - name: Publish to main (everything passed)
        if: startsWith(steps.bump.outputs.result, 'bumped') && steps.check.outcome == 'success'
        run: |
          git config user.name "mikesimone"
          git config user.email "mike@mikesimone.net"
          git add Dockerfile
          git commit -m "Bump signal-cli to ${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.result }}); tests and contract check pass"
          git push origin HEAD:main
      - name: Open an issue (something failed)
        if: startsWith(steps.bump.outputs.result, 'bumped') && steps.check.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "signal-cli ${{ steps.bump.outputs.version }} is out, but the tests or contract check failed against it, so the Dockerfile was NOT changed."
            echo
            echo '```'
            tail -n 60 check.log
            echo '```'
          } > body.md
          gh issue create --title "signal-cli ${{ steps.bump.outputs.version }}: bump needs attention" --body-file body.md
          exit 1
